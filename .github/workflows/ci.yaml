name: CI

on:
  push:
    branches: [ "feature/**" ]
  pull_request:
    branches: [ main, "maintenance/*" ]
  workflow_dispatch:

concurrency:
  group: stripe-element-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify
        env:
          STRIPE_TEST_API_KEY: ${{ secrets.STRIPE_TEST_API_KEY }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          STRIPE_TEST_CUSTOMER_ID: ${{ secrets.STRIPE_TEST_CUSTOMER_ID }}
          STRIPE_TEST_PRICE_ID: ${{ secrets.STRIPE_TEST_PRICE_ID }}
        run: mvn -B --no-transfer-progress verify